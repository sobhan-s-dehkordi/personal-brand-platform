name: build-and-test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  publication-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified secret scanner
        shell: pwsh
        run: ./tools/Install-Gitleaks.ps1
      - name: Check publication allowlist and entire history
        shell: pwsh
        run: ./tools/Test-Publication.ps1 -History
      - name: Verify publication checks reject unsafe examples
        shell: pwsh
        run: ./tools/Test-PublicationGuards.ps1
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Start isolated SQL Server with a generated credential
        shell: bash
        run: |
          password="Ci!$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "PERSONALBRAND_TEST_SQL=Server=localhost,1433;User ID=sa;Password=$password;TrustServerCertificate=True" >> "$GITHUB_ENV"
          docker run --detach --name personalbrand-test-sql \
            --publish 127.0.0.1:1433:1433 \
            --env ACCEPT_EULA=Y --env MSSQL_PID=Developer \
            --env MSSQL_SA_PASSWORD="$password" mcr.microsoft.com/mssql/server:2022-latest
          for attempt in {1..60}; do
            if docker exec personalbrand-test-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$password" -C -Q 'SELECT 1' -b >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo 'SQL Server did not become ready.' >&2
          exit 1
      - run: dotnet restore PersonalBrand.sln
      - run: dotnet build PersonalBrand.sln --no-restore --configuration Release
      - run: dotnet test PersonalBrand.sln --no-build --no-restore --configuration Release
      - name: Remove temporary SQL container
        if: always()
        run: docker rm --force personalbrand-test-sql || true
