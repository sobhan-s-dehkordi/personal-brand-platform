services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env}
      MSSQL_PID: Developer
    ports: ["127.0.0.1:14333:1433"]
    volumes: [sql-data:/var/opt/mssql]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b"]
      interval: 10s
      timeout: 5s
      retries: 20
  migrate:
    build:
      context: .
      dockerfile: src/PersonalBrand.Admin/Dockerfile
    command: ["--migrate"]
    environment:
      ConnectionStrings__DefaultConnection: "Server=sql;Database=PersonalBrand;User ID=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True"
    depends_on:
      sql: {condition: service_healthy}
  web:
    build:
      context: .
      dockerfile: src/PersonalBrand.Web/Dockerfile
    environment: &app-env
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: https://+:8443
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/dev.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${DEV_CERT_PASSWORD:?Set DEV_CERT_PASSWORD}
      ConnectionStrings__DefaultConnection: "Server=sql;Database=PersonalBrand;User ID=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True"
      Storage__Root: /data/uploads
      Site__BaseUrl: https://localhost:7001
    ports: ["127.0.0.1:7001:8443"]
    volumes: [uploads:/data/uploads, "./.certs:/https:ro"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  admin:
    build:
      context: .
      dockerfile: src/PersonalBrand.Admin/Dockerfile
    environment:
      <<: *app-env
      Security__DataProtectionPath: /data/keys
    ports: ["127.0.0.1:7002:8443"]
    volumes: [uploads:/data/uploads, admin-keys:/data/keys, "./.certs:/https:ro"]
    depends_on:
      migrate: {condition: service_completed_successfully}
volumes:
  sql-data:
  uploads:
  admin-keys:

